# Настройки тестовой базы: та же in-memory H2 с PostgreSQL-совместимым режимом,
# что и в application-test.yml. Flyway включён, чтобы прогонять реальные миграции
# перед запуском интеграционных тестов.
spring.datasource.url=jdbc:h2:mem:filmorate-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=true

spring.jpa.hibernate.ddl-auto=none
