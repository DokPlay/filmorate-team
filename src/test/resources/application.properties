# Test base settings: the same in-memory H2 with PostgreSQL-compatible mode,
# the same as in the application-test.yml. Flyway is enabled to run real migrations
# before running integration tests.
spring.datasource.url=jdbc:h2:mem:filmorate-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-on-validation-error=true

spring.jpa.hibernate.ddl-auto=none
