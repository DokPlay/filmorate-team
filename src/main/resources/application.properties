# Основная конфигурация находится в application.yml, здесь дублируются только ключевые параметры для простоты отладки.
spring.application.name=filmorate
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Поддержка переменных окружения остаётся основной точкой настройки.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/filmorate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:filmorate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:filmorate}

# Flyway инициализируется автоматически через application.yml.
