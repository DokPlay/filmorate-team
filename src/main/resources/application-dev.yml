spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/filmorate}
    username: ${SPRING_DATASOURCE_USERNAME:filmorate}
    password: ${SPRING_DATASOURCE_PASSWORD:filmorate}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

# В DEV включаем подробный SQL и оставляем возможность очистки базы через Flyway.
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.datasource.init.ScriptUtils: DEBUG
